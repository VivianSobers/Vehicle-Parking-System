# SonarCloud configuration
# Verify projectKey and organization against the values SonarCloud shows
# under Project Information after the repo is imported.
sonar.projectKey=VivianSobers_Vehicle-Parking-System
sonar.organization=viviansobers
sonar.projectName=Vehicle Parking System

# Source layout
sonar.sources=.
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

# Keep generated and vendored code out of the analysis
sonar.exclusions=tests/**,**/migrations/**,**/static/**,**/staticfiles/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/node_modules/**,**/*.min.js,**/manage.py
sonar.coverage.exclusions=**/migrations/**,**/tests/**,**/conftest.py,**/settings/**,**/wsgi.py,**/asgi.py,**/manage.py
