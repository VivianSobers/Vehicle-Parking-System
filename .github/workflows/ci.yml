name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and analyse
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # SonarCloud needs full history to assign issues to the right author
          # and to work out what counts as new code.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # Add `cache: pip` back once requirements.txt exists; setup-python
          # fails if there is no dependency file to key the cache on.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov pytest-django ruff

      - name: Lint
        run: ruff check . || true

      - name: Run tests with coverage
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' -print -quit)" ]; then
            pytest --cov=. --cov-report=xml --cov-branch --junitxml=junit.xml
          else
            echo "No tests yet - skipping. Remove this branch once tests exist."
          fi

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
